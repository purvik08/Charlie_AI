[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charlie"
version = "0.9.0"
description = "Offline AI Assistant - CLI (Project Charlie)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyttsx3>=2.90",
    "requests>=2.28.1",
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
    "psutil>=5.9.0",
    "llama-cpp-python>=0.2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[project.scripts]
charlie = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "config*", "features*", "models*", "ui*"]
